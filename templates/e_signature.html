<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electronic Signature | Rockview University</title>

  <style>
    :root {
      --primary: #003366;
      --primary-light: #0b5da7;
      --secondary: #006400;
      --accent: #00a878;
      --ink: #111111;
      --muted: #5b6472;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 12px;
      color: #1f2937;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(0, 168, 120, .22), transparent 28%),
        radial-gradient(circle at 92% 82%, rgba(11, 93, 167, .24), transparent 30%),
        linear-gradient(135deg, #eaf4ff, #f8fbff 48%, #edf9f4);
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      content: "";
      filter: blur(3px);
      opacity: .45;
      pointer-events: none;
    }

    body::before {
      top: -90px;
      left: -70px;
      background: linear-gradient(135deg, rgba(0, 51, 102, .46), rgba(0, 168, 120, .20));
      animation: drift 9s ease-in-out infinite alternate;
    }

    body::after {
      right: -80px;
      bottom: -100px;
      background: linear-gradient(135deg, rgba(0, 168, 120, .36), rgba(11, 93, 167, .20));
      animation: drift 11s ease-in-out infinite alternate-reverse;
    }

    .container {
      width: min(900px, 100%);
      height: calc(100vh - 24px);
      max-height: calc(100vh - 24px);
      overflow: hidden;
      padding: 14px 30px;
      border: 1px solid rgba(255, 255, 255, .82);
      border-radius: 20px;
      background: rgba(255, 255, 255, .97);
      box-shadow: 0 20px 45px rgba(0, 51, 102, .18), 0 4px 12px rgba(0, 0, 0, .08);
      animation: pageEnter .8s ease-out both;
    }

    h2 {
      margin: 0;
      color: var(--primary);
      text-align: center;
      font-size: clamp(1.35rem, 3vw, 1.85rem);
      animation: titleGlow 3s ease-in-out infinite;
    }

    .page-heading {
      margin: 2px 0 8px;
      color: var(--muted);
      text-align: center;
      font-size: clamp(.95rem, 2vw, 1.15rem);
      font-weight: 700;
    }

    .section-title {
      margin: 7px 0 2px;
      color: var(--secondary);
      text-align: center;
      font-size: 1rem;
    }

    .section-title::after {
      display: block;
      width: 52px;
      height: 3px;
      margin: 3px auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--secondary), var(--accent));
      content: "";
    }

    .note {
      margin: 2px auto 4px;
      color: var(--muted);
      text-align: center;
      font-size: .75rem;
      line-height: 1.2;
    }

    .canvas-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      width: 100%;
      padding: 4px;
      border-radius: 13px;
      background: linear-gradient(120deg, rgba(0, 51, 102, .2), rgba(0, 168, 120, .26), rgba(11, 93, 167, .2));
      background-size: 240% 240%;
      animation: borderFlow 5s ease-in-out infinite;
    }

    .canvas-wrap::after {
      position: absolute;
      inset: 3px;
      border: 1px solid rgba(0, 168, 120, .3);
      border-radius: 10px;
      content: "";
      pointer-events: none;
      animation: innerPulse 2.8s ease-in-out infinite;
    }

    canvas {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: #fff;
      cursor: crosshair;
      touch-action: none;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
      transition: box-shadow .25s ease, transform .25s ease;
    }

    canvas:hover,
    canvas:focus {
      outline: none;
      box-shadow: 0 7px 18px rgba(0, 168, 120, .25);
      transform: translateY(-1px);
    }

    /* Large rectangular signature fields */
    #approval-pad { height: 125px; }
    #signature-pad { height: 155px; }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 5px;
    }

    button {
      min-width: 135px;
      padding: 7px 16px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), var(--primary-light) 55%, var(--accent));
      box-shadow: 0 4px 10px rgba(0, 51, 102, .22);
      cursor: pointer;
      font: inherit;
      font-size: .82rem;
      font-weight: 700;
      transition: transform .25s ease, box-shadow .25s ease;
      animation: buttonPulse 3.5s ease-in-out infinite;
    }

    button:hover {
      box-shadow: 0 8px 17px rgba(0, 91, 138, .3);
      transform: translateY(-2px);
    }

    #clearApproval,
    #clear { background: linear-gradient(135deg, #64748b, #475569); }

    #save { background: linear-gradient(135deg, #007a4d, #00a878); }

    @keyframes pageEnter {
      from { opacity: 0; transform: translateY(14px) scale(.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(30px, 20px) scale(1.1); }
    }

    @keyframes titleGlow {
      0%, 100% { text-shadow: 0 0 0 rgba(0, 168, 120, 0); }
      50% { text-shadow: 0 0 12px rgba(0, 168, 120, .2); }
    }

    @keyframes borderFlow {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @keyframes innerPulse {
      0%, 100% { opacity: .35; transform: scale(.995); }
      50% { opacity: .9; transform: scale(1.002); }
    }

    @keyframes buttonPulse {
      0%, 100% { box-shadow: 0 4px 10px rgba(0, 51, 102, .22); }
      50% { box-shadow: 0 6px 15px rgba(0, 168, 120, .28); }
    }

    @media (max-height: 650px) {
      .container { padding: 8px 22px; }
      .page-heading { margin-bottom: 3px; }
      .section-title { margin-top: 4px; }
      .note { font-size: .68rem; }
      #approval-pad { height: 90px; }
      #signature-pad { height: 110px; }
      button { padding: 5px 12px; font-size: .75rem; }
    }

    @media (max-width: 600px) {
      body { padding: 6px; }
      .container {
        height: calc(100vh - 12px);
        max-height: calc(100vh - 12px);
        padding: 9px 12px;
        border-radius: 15px;
      }
      #approval-pad { height: 100px; }
      #signature-pad { height: 125px; }
      .section-title { font-size: .9rem; }
      .note { font-size: .68rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h2>Rockview University</h2>
    <h3 class="page-heading">Electronic Signature</h3>

    <h3 class="section-title">Approval Mark</h3>
    <p class="note">Write <b>CLEAR</b> or draw a line in the rectangular field below.</p>
    <div class="canvas-wrap">
      <canvas id="approval-pad" width="700" height="125" tabindex="0" aria-label="Approval mark drawing area"></canvas>
    </div>
    <div class="buttons">
      <button type="button" id="clearApproval">Clear Approval</button>
    </div>

    <h3 class="section-title">Officer Signature</h3>
    <p class="note">Sign using a mouse, stylus or touch device. The ink is standard black.</p>
    <div class="canvas-wrap">
      <canvas id="signature-pad" width="700" height="155" tabindex="0" aria-label="Officer signature drawing area"></canvas>
    </div>
    <div class="buttons">
      <button type="button" id="clear">Clear Signature</button>
      <button type="submit" id="save" form="signatureForm">Save</button>
    </div>

    <form id="signatureForm" method="POST">
      <input type="hidden" name="approval" id="approval">
      <input type="hidden" name="signature" id="signature">
    </form>
  </main>

  <script>
    function setupSignaturePad(canvasId, clearButtonId) {
      const canvas = document.getElementById(canvasId);
      const clearButton = document.getElementById(clearButtonId);
      const context = canvas.getContext('2d');
      let drawing = false;
      let hasInk = false;

      context.lineCap = 'round';
      context.lineJoin = 'round';
      context.strokeStyle = '#111111';
      context.lineWidth = 3.2;

      function getPoint(event) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (event.clientX - rect.left) * (canvas.width / rect.width),
          y: (event.clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      function startDrawing(event) {
        event.preventDefault();
        drawing = true;
        hasInk = true;
        const point = getPoint(event);
        context.beginPath();
        context.moveTo(point.x, point.y);
        context.lineTo(point.x + 0.01, point.y + 0.01);
        context.stroke();
        canvas.setPointerCapture?.(event.pointerId);
      }

      function draw(event) {
        if (!drawing) return;
        event.preventDefault();
        const point = getPoint(event);
        context.lineTo(point.x, point.y);
        context.stroke();
      }

      function stopDrawing(event) {
        if (!drawing) return;
        drawing = false;
        context.closePath();
        if (event?.pointerId !== undefined) {
          canvas.releasePointerCapture?.(event.pointerId);
        }
      }

      function clearCanvas() {
        context.clearRect(0, 0, canvas.width, canvas.height);
        hasInk = false;
      }

      canvas.addEventListener('pointerdown', startDrawing);
      canvas.addEventListener('pointermove', draw);
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointercancel', stopDrawing);
      canvas.addEventListener('pointerleave', stopDrawing);
      clearButton.addEventListener('click', clearCanvas);

      return {
        hasInk: () => hasInk,
        dataUrl: () => canvas.toDataURL('image/png')
      };
    }

    const approvalPad = setupSignaturePad('approval-pad', 'clearApproval');
    const signaturePad = setupSignaturePad('signature-pad', 'clear');

    document.getElementById('signatureForm').addEventListener('submit', function (event) {
      if (!approvalPad.hasInk() || !signaturePad.hasInk()) {
        event.preventDefault();
        alert('Please complete both signature fields before saving.');
        return;
      }

      document.getElementById('approval').value = approvalPad.dataUrl();
      document.getElementById('signature').value = signaturePad.dataUrl();
    });
  </script>
</body>
</html>
